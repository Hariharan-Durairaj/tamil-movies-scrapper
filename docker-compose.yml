version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: movie_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: movie_automator
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_password   # change this in production
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_automator"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      args:
        REPO_URL: https://github.com/Hariharan-Durairaj/tamil-movies-scrapper.git
        REPO_BRANCH: main
        CACHE_BUST: ${CACHE_BUST:-default}
    container_name: movie_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    # ── Xvfb / headful-Chrome requirements ──────────────────────────────
    # shm_size: Chrome uses /dev/shm for shared memory.  The default 64 MB
    #           is far too small and causes tab crashes.  2 GB is safe.
    shm_size: '2gb'
    # SYS_ADMIN: required by undetected-chromedriver / Chrome's sandbox
    #            inside a Docker container (same as --cap-add=SYS_ADMIN on
    #            docker run).
    cap_add:
      - SYS_ADMIN
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: movie_automator
      DB_USER: movie_user
      DB_PASSWORD: movie_password        # must match db service above
      # Virtual display created by Xvfb in entrypoint.sh.
      # All child processes (including Chrome) inherit this automatically.
      DISPLAY: ":99"
    volumes:
      - ./downloads:/app/downloads       # torrent files persisted on host
      - ./logs:/app/logs                 # log files persisted on host
    # Optional: pass extra API keys without rebuilding the image
    # env_file:
    #   - .env

volumes:
  pg_data:
    driver: local
